baseURL = "https://edinburgh-orthodox.org.uk/"
locale = "en-GB"
title = "St Andrew's Orthodox Church"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  description = "Orthodox Community of St Andrew, Edinburgh"
  charityNumber = "SC054378"
  # Public Google Calendar ID for the services calendar. Leave empty until the
  # calendar account exists (issue #5); the homepage then shows the sample week
  # from data/services.yaml. Set it and the homepage shows the Google embed.
  calendarID = ""

[permalinks]
  news = "/news/:contentbasename/"

[[menus.main]]
  name = "Our Churches"
  pageRef = "/churches"
  weight = 10
  [menus.main.params]
    primary = true

