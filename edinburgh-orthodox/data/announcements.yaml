  ### Lindisfarne pilgrimage
- >-
  A full-day pilgrimage to the Holy Island of Lindisfarne on Saturday 21 November 2026,
  departing from 2 Meadow Lane at 7:30am.
- >-
  *Travel* By private cars, with contributions towards the drivers' fuel: drivers £0, passengers £10.
  If the contribution needs to be different, or would stop you taking part, speak to Eleanna or Antonios.
  If you are making your own arrangements, let the coordinators know. Drivers are needed.
- >-
  *Timetable* Divine Liturgy 10:00 to 11:30; fellowship at the Community Hall 12:00 to 13:30 with a Q&A
  led by Bishop Raphael (bring lunch if you can, fish may be eaten, and something to share if possible);
  free time 13:30 to 14:30 to explore the island, weather permitting; leave from 14:40. The causeway is
  safe to cross between 01:45 and 10:00, and again from 14:40 to 22:00, so please arrive by 9:45 at the latest.
- >-
  *Bookings* Eleanna Bozini, [07395 625298](tel:+447395625298), [eleanna.boz@gmail.com](mailto:eleanna.boz@gmail.com);
  Antonios McDermott, [marcusamcdermott@gmail.com](mailto:marcusamcdermott@gmail.com), [07437 737307](tel:+447437737307).
