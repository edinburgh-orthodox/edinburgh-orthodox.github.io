# Sample announcements for the week of 25 October 2026. Replace with current, confirmed information.
- >-
  Week of 25 October 2026.
- >-
  Tuesday 27 October, 7:30pm at Meadow Lane: catechetical class led by Bishop Raphael. All welcome.
- >-
  Wednesday 28 October, 7:30pm at Meadow Lane: choir class, with liturgy hymns and rehearsal for the Christmas carols.
- >-
  Thursday 29 October, 7:30pm at Meadow Lane: Youth Fellowship of St Cuthbert and St Gregory the Theologian
  speaker event. Dr Zinaida Lewczuk will speak on Digital Addictions. All welcome.
- >-
  Confessions: Bishop Raphael, Fr Antonios, Fr Luke, and Fr John Nankivell can hear confessions by appointment.
  There are no walk-in confessions with His Grace, Bishop Raphael until further notice.
- >-
  Lindisfarne pilgrimage: a full-day pilgrimage to the Holy Island of Lindisfarne on Saturday 21 November 2026,
  departing from 2 Meadow Lane at 7:30am.
- >-
  Travel is by private cars, and participants are expected to contribute towards the drivers' fuel:
  drivers £0, passengers £10. If the contribution needs to be different, or would stop you taking part,
  speak to Eleanna or Antonios. If you are making your own arrangements, let the coordinators know.
  Drivers are needed.
- >-
  Timetable: Divine Liturgy 10:00 to 11:30; fellowship at the Community Hall 12:00 to 13:30 with a Q&A led by
  Bishop Raphael (bring lunch if you can, fish may be eaten, and something to share if possible); free time
  13:30 to 14:30 to explore the island, weather permitting; leave from 14:40. The causeway is safe to cross
  between 01:45 and 10:00, and again from 14:40 to 22:00, so please arrive by 9:45 at the latest.
- >-
  Bookings and more information: Eleanna Bozini, 07395 625298, eleanna.boz@gmail.com; Antonios McDermott,
  marcusamcdermott@gmail.com, 07437 737307.
- >-
  Dunblane Church fundraising event and baking contributions: Saturday 7 November at Dunblane Cathedral.
  Anyone who wishes to support the Dunblane Orthodox Church Community is welcome, and baked cake contributions
  can be brought along. Contributions will be taken to Dunblane early on Saturday morning.
- >-
  Friday 20 November, Forefeast of the Entrance of the Mother of God into the Temple: baptisms at Chapel Street,
  time to be confirmed.
