{{/* News section page at /news/, listing all published posts newest first. */}}
{{ define "main" }}
    <div class="wrap">
        <section class="page-section">
            <h1>{{ .Title }}</h1>
            {{ with .Description }}<p class="page-intro">{{ . }}</p>{{ end }}

            {{ partial "news-list.html" .Pages.ByDate.Reverse }}
        </section>
    </div>
{{ end }}
