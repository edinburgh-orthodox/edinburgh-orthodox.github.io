name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: edinburgh-orthodox/resources/_gen
          key: ${{ runner.os }}-hugo-images-${{ hashFiles('edinburgh-orthodox/content/**/*.jpg', 'edinburgh-orthodox/content/**/*.jpeg', 'edinburgh-orthodox/content/**/*.png', 'edinburgh-orthodox/content/**/*.webp', 'edinburgh-orthodox/content/**/*.gif', 'edinburgh-orthodox/content/**/*.tiff') }}
          restore-keys: |
            ${{ runner.os }}-hugo-images-

      - name: Build
        run: hugo --source edinburgh-orthodox --minify --baseURL https://edinburgh-orthodox.github.io/edinburgh-orthodox.org.uk/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: edinburgh-orthodox/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
