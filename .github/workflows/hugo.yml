name: Hugo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@v4
        with:
          path: edinburgh-orthodox/resources/_gen
          key: ${{ runner.os }}-hugo-images-${{ hashFiles('edinburgh-orthodox/content/**/*.jpg', 'edinburgh-orthodox/content/**/*.jpeg', 'edinburgh-orthodox/content/**/*.png', 'edinburgh-orthodox/content/**/*.webp', 'edinburgh-orthodox/content/**/*.gif', 'edinburgh-orthodox/content/**/*.tiff') }}
          restore-keys: |
            ${{ runner.os }}-hugo-images-

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Test the page and the send script
        run: |
          bun scripts/test_admin_logic.js
          bun scripts/test_send_weekly_post.js

      - name: Build
        run: hugo --source edinburgh-orthodox --minify

      - name: Build search index
        run: npx -y pagefind@1.6.0 --site edinburgh-orthodox/public
