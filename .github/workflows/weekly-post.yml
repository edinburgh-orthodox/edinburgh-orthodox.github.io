name: Send weekly post
run-name: Weekly post ${{ inputs.dry_run && 'dry run' || 'live send' }}

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only, do not post or send"
        type: boolean
        default: true
      channels:
        description: "Channels to send"
        type: choice
        options:
          - both
          - facebook
          - mailchimp
        default: both

permissions:
  contents: read

concurrency:
  group: weekly-post
  cancel-in-progress: false

jobs:
  send:
    name: Send weekly post
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Test formatting
        run: |
          bun scripts/test_admin_logic.js
          bun scripts/test_send_weekly_post.js
      - name: Post to Facebook and Mailchimp
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNELS: ${{ inputs.channels }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_API_VERSION: v24.0
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_SERVER_PREFIX: ${{ secrets.MAILCHIMP_SERVER_PREFIX }}
          MAILCHIMP_AUDIENCE_ID: ${{ secrets.MAILCHIMP_AUDIENCE_ID }}
          MAILCHIMP_REPLY_TO: ${{ secrets.MAILCHIMP_REPLY_TO }}
          MAILCHIMP_FROM_NAME: "St Andrew's Orthodox Church"
        run: bun scripts/send_weekly_post.js
